<title>Beacon Social Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — slim header, community rail on the left, month calendar as the working surface, post editor slides in from the right. */
:root {
  /* Beacon Management design system: blue #153a58, teal #55c1c7, coral #ee8f80, tan #f6ecd6 */
  --bg: #faf6ee;
  --surface: #ffffff;
  --surface-2: #f1ebdd;
  --line: #ddd5c3;
  --fg: #132a3f;
  --muted: #5d6874;
  --navy: #153a58;
  --header: #153a58;
  --beam: #55c1c7;
  --beam-ink: #0b2a3f;
  --coral: #ee8f80;
  --tan: #f6ecd6;
  --focus: #2b8f96;

  --t-amenity: #1f8a7a;
  --t-floorplan: #4a5bd4;
  --t-holiday: #c2413a;
  --t-funday: #c77c06;
  --t-video: #8a44c4;
  --t-special: #2e8a3e;
  --t-other: #6b7789;

  --ok: #1e7f45;
  --ok-bg: #e2f4e8;
  --warn: #9a5b00;
  --warn-bg: #fdf0d6;
  --bad: #b3261e;
  --bad-bg: #fbe3e1;

  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --r: 8px;
  --shadow: 0 10px 30px rgba(15, 30, 55, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1724; --surface: #13233a; --surface-2: #1a2d46; --line: #2a405c;
    --fg: #e8eef5; --muted: #98a8ba; --navy: #9cc5e6; --header: #0b1c2e; --beam: #55c1c7; --beam-ink: #06202f; --coral: #f2a397; --tan: #3b3427; --focus: #7fd3d8;
    --t-amenity: #4cc2ae; --t-floorplan: #8b98f2; --t-holiday: #ef7a72; --t-funday: #f0a83a; --t-video: #bf8bea; --t-special: #6cc77a; --t-other: #98a4b5;
    --ok: #6fd193; --ok-bg: #173527; --warn: #f2bd5c; --warn-bg: #3a2c12; --bad: #f28b82; --bad-bg: #3d1c1a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1724; --surface: #13233a; --surface-2: #1a2d46; --line: #2a405c;
  --fg: #e8eef5; --muted: #98a8ba; --navy: #9cc5e6; --header: #0b1c2e; --beam: #55c1c7; --beam-ink: #06202f; --coral: #f2a397; --tan: #3b3427; --focus: #7fd3d8;
  --t-amenity: #4cc2ae; --t-floorplan: #8b98f2; --t-holiday: #ef7a72; --t-funday: #f0a83a; --t-video: #bf8bea; --t-special: #6cc77a; --t-other: #98a4b5;
  --ok: #6fd193; --ok-bg: #173527; --warn: #f2bd5c; --warn-bg: #3a2c12; --bad: #f28b82; --bad-bg: #3d1c1a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
.app-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--header); color: #fff;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { height: 40px; width: auto; flex: none; display: block; }
.brand-div { width: 1px; align-self: stretch; background: rgba(255,255,255,.25); }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand-sub { font-size: 12px; opacity: .75; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab {
  background: transparent; border: 0; color: #fff; opacity: .78; cursor: pointer;
  padding: 7px 12px; border-radius: 6px; font-family: var(--f-display); font-weight: 700; font-size: 14px;
}
.tab:hover { opacity: 1; background: rgba(255,255,255,.08); }
.tab[aria-selected="true"] { opacity: 1; background: rgba(255,255,255,.14); box-shadow: inset 0 -2px 0 var(--beam); }

/* Shell */
.shell {
  display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
  max-width: 1500px; margin: 0 auto;
}
@media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rail-list { display: flex; flex-direction: column; gap: 2px; }
.rail-item {
  display: grid; grid-template-columns: 10px minmax(0,1fr) auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--r);
  padding: 8px 10px; cursor: pointer;
}
.rail-item:hover { background: var(--surface-2); }
.rail-item[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.rail-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--muted); }
.rail-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-meta { font-size: 12px; color: var(--muted); }
.rail-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rail-count .attn { color: var(--warn); font-weight: 600; }
.rail-select { display: none; }
@media (max-width: 900px) {
  .rail-list { display: none; }
  .rail-select { display: block; width: 100%; padding: 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
}

/* Toolbar */
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-title { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; min-width: 9ch; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
  padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.icon { padding: 7px 10px; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1a2c; } }
:root[data-theme="dark"] .btn.primary { color: #0b1a2c; }
.btn.beam { background: var(--beam); border-color: var(--beam); color: var(--beam-ink); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }

.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--fg); border: 1px solid transparent;
}
.pill .n { font-family: var(--f-mono); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-head, .cal-week { display: grid; grid-template-columns: 74px repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 8px 10px; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.cal-week + .cal-week { border-top: 1px solid var(--line); }
.week-gutter { border-right: 1px solid var(--line); padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; background: var(--surface-2); }
.week-gutter .wk { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: center; }
.week-gutter .btn { padding: 5px 4px; font-size: 11.5px; }
.week-done { font-size: 11px; color: var(--ok); text-align: center; font-weight: 700; }
.cal-day { min-height: 128px; padding: 6px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal-day:nth-child(2) { border-left: 0; }
.cal-day.out { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 7px); }
.cal-day.out .dnum { opacity: .45; }
.dnum { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cal-day.today .dnum b { background: var(--beam); color: var(--beam-ink); border-radius: 4px; padding: 0 5px; }
.add-day { opacity: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; }
.cal-day:hover .add-day, .add-day:focus-visible { opacity: 1; }
.add-day:hover { background: var(--surface-2); color: var(--fg); }

.chip {
  display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 6px; align-items: center;
  border: 1px solid var(--line); border-left: 3px solid var(--tc, var(--t-other));
  background: var(--surface); border-radius: 6px; padding: 3px 5px 3px 3px; cursor: pointer; text-align: left; width: 100%;
}
.chip:hover { border-color: var(--muted); border-left-color: var(--tc); }
.chip .thumb { width: 30px; height: 30px; border-radius: 4px; background: var(--surface-2); background-size: cover; background-position: center; position: relative; overflow: hidden; }
.chip .thumb.gfx { background: var(--tc); }
.chip .thumb.gfx::after { content: ""; position: absolute; inset: 7px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; }
.chip .thumb.missing { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, transparent 4px 8px); border: 1px dashed var(--line); }
.chip .ct { min-width: 0; }
.chip .ctitle { font-size: 12.5px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cmeta { font-size: 11px; color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; }
.chip.needs { border-style: dashed; border-left-style: solid; background: var(--warn-bg); }
.chip.approved .ctitle::before { content: "✓ "; color: var(--ok); }
.chip.posted { opacity: .7; }
.chip.held, .chip.failed { background: var(--bad-bg); }
.st { font-weight: 700; }
.st.approved { color: var(--ok); } .st.needs { color: var(--warn); } .st.held, .st.failed { color: var(--bad); }

/* Agenda (narrow) */
.agenda { display: flex; flex-direction: column; gap: 14px; }
.ag-week { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ag-week-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.ag-day { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.ag-day:first-of-type { border-top: 0; }
.ag-date { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ag-date b { display: block; font-size: 18px; color: var(--fg); }
.ag-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ag-list .chip { grid-template-columns: 44px minmax(0,1fr); }
.ag-list .chip .thumb { width: 44px; height: 44px; }

/* Empty state */
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); background: var(--surface); }
.empty h3 { color: var(--fg); margin-bottom: 6px; font-size: 18px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 28, .45); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(980px, 100%);
  background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer-head h2 { font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body { flex: 1; overflow: auto; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; padding: 16px; align-content: start; }
@media (max-width: 760px) { .drawer-body { grid-template-columns: minmax(0,1fr); } }
.drawer-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); align-items: center; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-family: var(--f-display); font-weight: 700; font-size: 12.5px; color: var(--muted); }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=url], .field input[type=number], .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px;
}
.field textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
.field .hint { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .field { flex: 1 1 140px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 14px; color: var(--fg); }
.counter { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-align: right; }
.counter.over { color: var(--bad); font-weight: 600; }

.preview-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.preview-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 13px; flex: none; background-size: cover; background-position: center; }
.preview-canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; background: var(--surface-2); }
.preview-video { width: 100%; aspect-ratio: 1/1; background: #000; display: block; }
.preview-text { padding: 10px 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.preview-text .tags { color: var(--focus); }
.pv-tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
.pv-tab { border: 0; background: transparent; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12.5px; color: var(--muted); }
.pv-tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.media-tile { position: relative; aspect-ratio: 1/1; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; padding: 0; background: var(--surface-2); background-size: cover; background-position: center; }
.media-tile[aria-pressed="true"] { border-color: var(--beam); }
.media-tile .vid { position: absolute; inset: auto 4px 4px auto; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; }
.media-tile.none { display: grid; place-items: center; font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; padding: 4px; }
.upload-tile { border: 1px dashed var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }

.checklist { display: flex; flex-direction: column; gap: 6px; }
.check { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; font-size: 13.5px; padding: 7px 10px; border-radius: 7px; }
.check.ok { background: var(--ok-bg); color: var(--ok); }
.check.warn { background: var(--warn-bg); color: var(--warn); }
.check.bad { background: var(--bad-bg); color: var(--bad); }
.check b { font-weight: 700; }

.callout { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; }
.callout.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.callout.warn b { color: inherit; }

/* Communities & settings */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h2 { font-size: 20px; }
.panel h3 { font-size: 15px; }
.split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0,1fr); } }
.harvest { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13.5px; }
.harvest .state { font-weight: 700; }
.harvest .state.bad { color: var(--bad); } .harvest .state.ok { color: var(--ok); } .harvest .state.warn { color: var(--warn); }
.src { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.swatch { width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer; }
.mix-row { display: grid; grid-template-columns: 110px minmax(0,1fr) 40px; gap: 10px; align-items: center; }
.mix-row input[type=range] { width: 100%; accent-color: var(--navy); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.status-line { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.status-line .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.status-line .dot.bad { background: var(--bad); } .status-line .dot.warn { background: var(--beam); } .status-line .dot.ok { background: var(--ok); }

/* Modal & toast */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(8, 16, 28, .5); }
.modal-box { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: 90vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-box h2 { font-size: 19px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(560px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); pointer-events: auto; }
.toast.bad { background: var(--bad); color: #fff; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > div { height: 100%; background: var(--beam); width: 0; transition: width .2s; }

.notice { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="app-header">
  <div class="brand">
    <img class="brand-mark" src="/_blob/d04578bbf195e2568cfe504c34a3582a" alt="Beacon Management">
    <span class="brand-div" aria-hidden="true"></span>
    <div>
      <div class="brand-name">Beacon Social</div>
      <div class="brand-sub">Social command center</div>
    </div>
  </div>

    <button class="tab" role="tab" id="tab-calendar" data-view="calendar" aria-selected="true">Calendar</button>
    <button class="tab" role="tab" id="tab-communities" data-view="communities" aria-selected="false">Communities</button>

</header>

<div class="shell">
  <aside class="rail" aria-label="Communities">
    <div class="eyebrow">Communities</div>
    <select class="rail-select" id="rail-select" aria-label="Choose community"></select>
    <div class="rail-list" id="rail-list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

// ---------- constants ----------
const TYPES = {
  amenity:   { label: 'Amenity',    tok: '--t-amenity' },
  floorplan: { label: 'Floor plan', tok: '--t-floorplan' },
  holiday:   { label: 'Holiday',    tok: '--t-holiday' },
  funday:    { label: 'Fun day',    tok: '--t-funday' },
  video:     { label: 'Video tour', tok: '--t-video' },
  special:   { label: 'Special',    tok: '--t-special' },
  other:     { label: 'Other',      tok: '--t-other' },
};
const BRAND = { blue: '#153a58', teal: '#55c1c7', coral: '#ee8f80', tan: '#f6ecd6', logo: 'b03616ee219788d7514c6e86e73656b4', logoWhite: 'd04578bbf195e2568cfe504c34a3582a' };
const PLATFORMS = { facebook: 'Facebook', instagram: 'Instagram', google: 'Google' };
const LIMITS = { instagram: 2200, facebook: 5000, google: 1500 };
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Advisory fair-housing phrase list. Flags for review; not legal advice.
const FH_RULES = [
  { re: /\bfamil(y|ies)[- ]?(friendly|oriented)?\b/i, why: 'Familial status is protected. Describe the property, not who should live there.' },
  { re: /\b(kids?|children|child)\b/i, why: 'References to children can imply familial-status preference.' },
  { re: /\b(adults? only|adult community|no kids|mature (residents|adults|individuals))\b/i, why: 'Excludes families with children.' },
  { re: /\b(empty[- ]nesters?|singles?|couples?|bachelors?|newlyweds?)\b/i, why: 'Describes a type of household. Describe amenities instead.' },
  { re: /\b(young professionals?|millennials?|retirees?|seniors?|elderly|students?)\b/i, why: 'Targets an age group or household type.' },
  { re: /\b(perfect|ideal|great) for (you and )?(your )?\w+/i, why: '"Perfect for ___" phrasing often implies who should live there. Check the noun.' },
  { re: /\b(exclusive|private community|restricted|integrated|ethnic|traditional neighborhood)\b/i, why: 'Can signal exclusion of protected classes.' },
  { re: /\b(safe|secure|crime[- ]free|low[- ]crime) (neighborhood|area|community)\b/i, why: 'Safety claims can be coded and are hard to substantiate. Describe specific features (e.g., controlled-access entry).' },
  { re: /\b(christian|church|synagogue|mosque|temple)\b/i, why: 'Religious references can imply religious preference.' },
  { re: /\b(able[- ]bodied|handicapped|wheelchair[- ]bound|healthy|mentally)\b/i, why: 'Disability-related language. Describe accessibility features instead.' },
  { re: /\b(english[- ]speaking|english only|american)\b/i, why: 'National origin is protected.' },
  { re: /\b(no section 8|no vouchers?|no housing assistance)\b/i, why: 'Source of income is protected in many Michigan jurisdictions.' },
  { re: /\bmaster (bed(room)?|suite)\b/i, why: 'Not a violation, but many fair housing guides now recommend "primary bedroom".' },
];

// ---------- state ----------
const today = new Date();
const S = {
  view: 'calendar',
  community: 'all',
  ym: initialMonth(),
  communities: {},   // id -> data
  posts: {},         // id -> data (current month)
  media: {},         // id -> data
  settings: null,
  db: null, assets: null, sample: null, user: null,
  canWrite: true,
  loaded: { communities: false, posts: false, settings: false },
  drawer: null,      // { id, draft, pv }
  editCommunity: null,
  narrow: matchMedia('(max-width: 760px)').matches,
  busy: false,
};
const imgCache = new Map();
let unsubPosts = null;

function initialMonth() {
  try { const v = localStorage.getItem('beacon.ym'); if (v && /^\d{4}-\d{2}$/.test(v)) return v; } catch (e) {}
  // default: next month (planning ahead)
  const d = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  return ymOf(d);
}
function ymOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ds(d) { return ymOf(d) + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDs(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; }
function monthBounds(ym) { const [y, m] = ym.split('-').map(Number); return { first: new Date(y, m - 1, 1), last: new Date(y, m, 0) }; }
function fmtShort(s) { const d = parseDs(s); return DOW[(d.getDay()+6)%7] + ' ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); }

// ---------- dom helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('--')) el.style.setProperty(k, v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
function toast(msg, bad) {
  const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status', text: msg });
  $('#toasts').append(t);
  setTimeout(() => t.remove(), bad ? 7000 : 4200);
}
function modal({ title, body, actions }) {
  const close = () => m.remove();
  const box = h('div', { class: 'modal-box', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('h2', { text: title }), body,
    h('div', { class: 'modal-actions' }, (actions || []).map(a => h('button', {
      class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''),
      onclick: async () => { if (a.onClick) { const keep = await a.onClick(close); if (keep === true) return; } close(); }
    }, a.label))));
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } }, box);
  document.body.append(m);
  const first = box.querySelector('button.primary') || box.querySelector('button');
  first && first.focus();
  return close;
}
function typeColor(t) { return `var(${(TYPES[t] || TYPES.other).tok})`; }
function comm(id) { return S.communities[id]; }
function blob(id) { return '/_blob/' + id; }
function lines(s) { return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }

// ---------- readiness & compliance ----------
function complianceHits(text) {
  const hits = [];
  for (const r of FH_RULES) { const m = String(text || '').match(r.re); if (m) hits.push({ phrase: m[0], why: r.why }); }
  for (const p of (S.settings?.extraPhrases || [])) {
    if (p && String(text || '').toLowerCase().includes(p.toLowerCase())) hits.push({ phrase: p, why: 'On your custom review list.' });
  }
  return hits;
}
function readiness(p) {
  const blockers = [], warnings = [], ok = [];
  if (p.needsData) blockers.push('Needs website info: ' + p.needsData);
  if (!String(p.caption || '').trim()) blockers.push('Caption is empty.');
  const plats = Object.keys(PLATFORMS).filter(k => p.platforms?.[k]);
  if (!plats.length) blockers.push('Pick at least one platform.');
  if (p.type === 'video' && !(p.assetId && p.mediaKind === 'video')) blockers.push('Upload or choose the walkthrough video.');
  const cap = String(p.caption || '') + (p.hashtags ? '\n\n' + p.hashtags : '');
  if (p.platforms?.instagram && cap.length > LIMITS.instagram) blockers.push(`Instagram caption is ${cap.length} characters; the limit is ${LIMITS.instagram}.`);
  const tagCount = (String(p.hashtags || '').match(/#/g) || []).length;
  if (p.platforms?.instagram && tagCount > 30) blockers.push('Instagram allows at most 30 hashtags.');
  const g = String(p.gbpCaption || p.caption || '');
  if (p.platforms?.google && g.length > LIMITS.google) blockers.push(`Google caption is ${g.length} characters; the limit is ${LIMITS.google}.`);
  const hits = complianceHits([p.title, p.caption, p.gbpCaption, p.overlay?.label].join('\n'));
  for (const x of hits) warnings.push(`Fair housing review: “${x.phrase}”. ${x.why}`);
  if (!p.assetId && p.type !== 'video' && !['holiday','funday'].includes(p.type)) warnings.push('No photo chosen. A branded graphic will be used instead.');
  if (!blockers.length && !warnings.length) ok.push('Ready to approve.');
  return { blockers, warnings, ok };
}

// ---------- canvas composite ----------
function loadImg(id) {
  if (!imgCache.has(id)) imgCache.set(id, new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = blob(id); }));
  return imgCache.get(id);
}
function shade(hex, amt) {
  const n = parseInt(String(hex || BRAND.blue).replace('#',''), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt)); g = Math.max(0, Math.min(255, g + amt)); b = Math.max(0, Math.min(255, b + amt));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function rr(ctx, x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+hh, r); ctx.arcTo(x+w, y+hh, x, y+hh, r); ctx.arcTo(x, y+hh, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/); const out = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
function regionLuma(ctx, x, y, w, hh) {
  try {
    const d = ctx.getImageData(Math.max(0, x | 0), Math.max(0, y | 0), Math.max(1, w | 0), Math.max(1, hh | 0)).data;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 16) { sum += 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]; n++; }
    return n ? sum / n : 255;
  } catch (e) { return 255; }
}
function tintLogo(img, fill) {
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const x = cv.getContext('2d'); x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = fill; x.fillRect(0, 0, cv.width, cv.height);
  return cv;
}
async function drawComposite(canvas, p) {
  const SZ = 1080; canvas.width = SZ; canvas.height = SZ;
  const ctx = canvas.getContext('2d');
  const c = comm(p.communityId) || {};
  const color = c.color || BRAND.blue;
  try { await document.fonts.ready; } catch (e) {}
  let photo = null;
  if (p.assetId && p.mediaKind !== 'video') { try { photo = await loadImg(p.assetId); } catch (e) { photo = null; } }
  if (photo) {
    const s = Math.max(SZ / photo.naturalWidth, SZ / photo.naturalHeight);
    const w = photo.naturalWidth * s, hh = photo.naturalHeight * s;
    ctx.drawImage(photo, (SZ - w) / 2, (SZ - hh) / 2, w, hh);
  } else {
    const g = ctx.createLinearGradient(0, 0, SZ, SZ);
    g.addColorStop(0, shade(BRAND.blue, 28)); g.addColorStop(1, shade(BRAND.blue, -38));
    ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);
    // beacon rays
    ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = BRAND.teal;
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(SZ*0.82, SZ*0.18); const a = -Math.PI*0.95 + i*0.13; ctx.lineTo(SZ*0.82 + Math.cos(a)*1600, SZ*0.18 + Math.sin(a)*1600); ctx.lineTo(SZ*0.82 + Math.cos(a+0.05)*1600, SZ*0.18 + Math.sin(a+0.05)*1600); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(85,193,199,.28)'; ctx.lineWidth = 3;
    for (let r = 120; r < 900; r += 110) { ctx.beginPath(); ctx.arc(SZ*0.82, SZ*0.18, r, 0, Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }
  const label = String(p.overlay?.label || '').trim();
  if (label) {
    const g2 = ctx.createLinearGradient(0, SZ*0.45, 0, SZ);
    g2.addColorStop(0, 'rgba(6,14,26,0)'); g2.addColorStop(1, 'rgba(6,14,26,.82)');
    ctx.fillStyle = g2; ctx.fillRect(0, SZ*0.45, SZ, SZ*0.55);
    ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'alphabetic';
    ctx.font = '800 92px "Schibsted Grotesk", Arial, sans-serif';
    const ls = wrapText(ctx, label, SZ - 140).slice(0, 3);
    let y = SZ - 120 - (ls.length - 1) * 98;
    ctx.fillStyle = p.type === 'holiday' ? BRAND.coral : BRAND.teal; ctx.fillRect(70, y - 120, 90, 10);
    ctx.fillStyle = '#ffffff';
    for (const l of ls) { ctx.fillText(l, 70, y); y += 98; }
    ctx.font = '700 30px "Schibsted Grotesk", Arial, sans-serif'; ctx.fillStyle = BRAND.tan;
    ctx.fillText(String(c.name || '').toUpperCase(), 72, SZ - 60); ctx.fillStyle = '#ffffff';
  }
  // corner logo: the community's own transparent logo straight on the image; boxed short code when there is none
  const corner = p.overlay?.corner || c.defaultCorner || 'tr';
  const m = 44;
  let logo = null; if (c.logoAssetId) { try { logo = await loadImg(c.logoAssetId); } catch (e) {} }
  if (logo) {
    const s = Math.min(400 / logo.naturalWidth, 150 / logo.naturalHeight);
    const lw = logo.naturalWidth * s, lh = logo.naturalHeight * s;
    const lx = corner === 'tl' ? m : SZ - m - lw, ly = m;
    let tone = c.logoTone || 'auto';
    if (tone === 'auto') tone = regionLuma(ctx, lx, ly, lw, lh) < 150 ? 'white' : 'original';
    const art = tone === 'original' ? logo : tintLogo(logo, tone === 'white' ? '#ffffff' : '#111111');
    ctx.save();
    if (tone === 'white') { ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 2; }
    else { ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = 12; }
    ctx.drawImage(art, lx, ly, lw, lh);
    ctx.restore();
  } else {
    const bw = 132, bh = 132, bx = corner === 'tl' ? m : SZ - m - bw, by = m;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(ctx, bx, by, bw, bh, 26); ctx.fill(); ctx.restore();
    ctx.fillStyle = color; ctx.textAlign = 'center';
    ctx.font = '800 46px "Schibsted Grotesk", Arial, sans-serif';
    ctx.fillText(String(c.short || (c.name || '?').slice(0,2)).toUpperCase().slice(0,3), bx + bw/2, by + 64);
    ctx.textAlign = 'left';
    let bl = null; try { bl = await loadImg(BRAND.logo); } catch (e) {}
    if (bl) { const w = 64, hh2 = w * bl.naturalHeight / bl.naturalWidth; ctx.drawImage(bl, bx + (bw - w) / 2, by + bh - hh2 - 14, w, hh2); }
  }
  if (!photo) {
    let wl = null; try { wl = await loadImg(BRAND.logoWhite); } catch (e) {}
    if (wl) { const w = 150, hh3 = w * wl.naturalHeight / wl.naturalWidth; ctx.globalAlpha = .95; ctx.drawImage(wl, SZ - 40 - w, SZ - 74 - hh3, w, hh3); ctx.globalAlpha = 1; }
  }
  if (S.settings?.eho !== false) {
    ctx.font = '700 22px "Atkinson Hyperlegible", Arial, sans-serif'; ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 6;
    ctx.fillText('Equal Housing Opportunity', SZ - 40, SZ - 34);
    ctx.shadowBlur = 0; ctx.textAlign = 'left';
  }
}

// ---------- data ----------
async function init() {
  renderAll();
  matchMedia('(max-width: 760px)').addEventListener('change', e => { S.narrow = e.matches; if (S.view === 'calendar') renderMain(); });
  const db = await (window.claude?.use ? claude.use('db') : null);
  S.db = db;
  if (!db) { S.loaded = { communities: true, posts: true, settings: true }; renderAll(); return; }
  claude.use('user').then(async u => { S.user = u; if (u) { const w = await u.can('data.write'); if (w === false) { S.canWrite = false; renderAll(); } } });
  claude.use('assets').then(a => { S.assets = a; if (S.drawer || S.view === 'communities') renderAll(); });
  claude.use('sample').then(s => { S.sample = s; renderAll(); });
  db.collection('communities').onSnapshot(snap => {
    S.communities = {}; snap.docs.forEach(d => S.communities[d.id] = d.data());
    S.loaded.communities = true; renderAll();
  }, e => console.warn(e));
  db.collection('media').onSnapshot(snap => {
    S.media = {}; snap.docs.forEach(d => S.media[d.id] = d.data());
    if (S.drawer || S.view === 'communities') renderAll();
  }, e => console.warn(e));
  db.doc('settings/brand').onSnapshot(d => { S.settings = d.exists ? d.data() : {}; S.loaded.settings = true; renderAll(); }, e => console.warn(e));
  subscribePosts();
}
function subscribePosts() {
  if (!S.db) return;
  if (unsubPosts) unsubPosts();
  S.loaded.posts = false; S.posts = {};
  const { first, last } = monthBounds(S.ym);
  const from = ds(mondayOf(first)), to = ds(addDays(mondayOf(last), 6));
  unsubPosts = S.db.collection('posts').where('date', '>=', from).where('date', '<=', to).onSnapshot(snap => {
    S.posts = {}; snap.docs.forEach(d => S.posts[d.id] = d.data());
    S.loaded.posts = true;
    if (S.drawer && S.drawer.id && !S.posts[S.drawer.id]) { /* deleted elsewhere */ }
    renderRail(); if (S.view === 'calendar') renderMain();
  }, e => { console.warn(e); toast('Could not load posts. Reload the page to try again.', true); });
}
function stamp() { return new Date().toISOString(); }
async function savePost(id, data) {
  data.updatedAt = stamp();
  if (id) { await S.db.doc('posts/' + id).set(data); return id; }
  const ref = await S.db.collection('posts').add(data); return ref.id;
}
function visiblePosts() {
  return Object.entries(S.posts).filter(([, p]) => S.community === 'all' || p.communityId === S.community)
    .filter(([, p]) => !p.communityId || !comm(p.communityId) || comm(p.communityId).active !== false);
}

// ---------- render: shell ----------
function renderAll() { renderTabs(); renderRail(); renderMain(); renderDrawer(); }
function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === S.view)));
}
function commList() {
  return Object.entries(S.communities).filter(([, c]) => c.active !== false).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
}
function renderRail() {
  const list = $('#rail-list'); list.replaceChildren();
  const sel = $('#rail-select'); sel.replaceChildren();
  const inMonth = Object.values(S.posts).filter(p => String(p.date).startsWith(S.ym));
  const counts = id => {
    const ps = inMonth.filter(p => id === 'all' || p.communityId === id);
    return { n: ps.length, attn: ps.filter(p => p.status === 'draft' && readiness(p).blockers.length).length };
  };
  const item = (id, name, meta, color) => {
    const c = counts(id);
    list.append(h('button', { class: 'rail-item', 'aria-current': String(S.community === id), onclick: () => { S.community = id; if (S.view === 'communities' && id !== 'all') S.editCommunity = id; renderAll(); } },
      h('span', { class: 'rail-dot', style: { background: color || 'var(--navy)' } }),
      h('span', { style: { minWidth: 0 } }, h('div', { class: 'rail-name', text: name }), meta ? h('div', { class: 'rail-meta', text: meta }) : null),
      h('span', { class: 'rail-count', title: `${c.n} posts this month, ${c.attn} need attention` }, String(c.n), c.attn ? h('span', { class: 'attn', text: ' · ' + c.attn + '!' }) : null)));
    sel.append(h('option', { value: id, selected: S.community === id }, name + (c.n ? ` (${c.n})` : '')));
  };
  item('all', 'All communities', `${commList().length} active`, null);
  for (const [id, c] of commList()) item(id, c.name, [c.city, c.state].filter(Boolean).join(', '), c.color);
  sel.onchange = () => { S.community = sel.value; if (S.view === 'communities' && sel.value !== 'all') S.editCommunity = sel.value; renderAll(); };
}
function renderMain() {
  const main = $('#main'); main.replaceChildren();
  if (!S.loaded.communities || !S.loaded.settings) { main.append(h('div', { class: 'empty' }, h('h3', { text: 'Loading your communities…' }))); return; }
  if (!S.db) { main.append(h('div', { class: 'empty' }, h('h3', { text: 'Open this page in Claude to load your data' }), h('p', { text: 'The command center keeps communities, posts and photos in its own database, which is available when the page is viewed on claude.ai while signed in.' }))); return; }
  if (S.view === 'calendar') renderCalendar(main);
  else if (S.view === 'communities') renderCommunities(main);
  else renderSettings(main);
}

// ---------- render: calendar ----------
function renderCalendar(main) {
  const { first, last } = monthBounds(S.ym);
  const posts = visiblePosts();
  const monthPosts = posts.filter(([, p]) => String(p.date).startsWith(S.ym)).map(([, p]) => p);
  const cnt = s => monthPosts.filter(p => p.status === s).length;
  const needs = monthPosts.filter(p => p.status === 'draft' && readiness(p).blockers.length).length;

  const scopeName = S.community === 'all' ? 'all communities' : (comm(S.community)?.name || '');
